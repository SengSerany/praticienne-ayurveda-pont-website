<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 49 560 415" width="560" height="415" role="img" aria-labelledby="schema-04-titre schema-04-desc">
  <title id="schema-04-titre">Lecture systémique</title>
  <desc id="schema-04-desc">Quatre repères reliés entre eux et légendés : le cycle en haut, figuré par un cercle, la digestion à droite, figurée par un contour d'estomac, le système nerveux en bas, figuré par un rectangle, le foie à gauche, figuré par son contour. Les traits pleins relient les repères voisins, les traits tiretés relient les repères opposés. Aucun n'est placé au-dessus des autres.</desc>

  <g fill="none" stroke="var(--c-encre, #2d2a26)" stroke-width="1">
    <line x1="297.5" y1="157.7" x2="403.8" y2="215.2"/>
    <line x1="406.7" y1="273.7" x2="341.6" y2="323"/>
    <line x1="237.7" y1="330.8" x2="133.2" y2="268.4"/>
    <line x1="137.9" y1="217.1" x2="207" y2="164.6"/>
  </g>

  <g fill="none" stroke="var(--c-encre, #2d2a26)" stroke-width="1" stroke-dasharray="2 3">
    <line x1="259.3" y1="185.2" x2="280.6" y2="308.2"/>
    <line x1="162.3" y1="246.1" x2="398.5" y2="241.5"/>
  </g>

  <g fill="none" stroke="var(--c-encre, #2d2a26)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="250" cy="132" r="42"/>
    <rect x="248" y="320" width="84" height="84" rx="10"/>

    <g transform="translate(38, 214)">
      <path d="M 6 26 C 8 12 26 4 50 4 C 76 4 104 12 113 24 C 116 29 112 35 104 39 C 88 47 66 58 46 62 C 28 66 10 54 6 38 Z"/>
      <path d="M 52 5 C 48 20 49 32 56 44"/>
    </g>

    <g transform="translate(396, 176)">
      <path d="M 40 16 C 16 34 8 66 20 90 C 32 112 62 120 82 106 C 92 99 96 88 94 80 C 90 70 78 70 72 78 C 64 88 52 82 50 68 C 48 52 52 32 54 22 Z"/>
      <path d="M 40 16 L 31 3"/>
      <path d="M 54 22 L 45 9"/>
      <path d="M 94 82 L 107 79"/>
    </g>
  </g>

  <g fill="var(--c-encre, #2d2a26)" font-family="var(--f-mono, JetBrains Mono, monospace)" font-size="20" letter-spacing="4.4" text-anchor="middle">
    <text x="250" y="76">CYCLE</text>
    <text x="450" y="322">DIGESTION</text>
    <text x="290" y="430">SYSTÈME</text>
    <text x="290" y="452">NERVEUX</text>
    <text x="98" y="330">FOIE</text>
  </g>
</svg>
